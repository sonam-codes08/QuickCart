<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — QuickCart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-header">
  <a class="logo" href="index.html" style="display:flex;align-items:center;gap:8px;">
    <div class="logo-mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6H5L7 15H18L20 8H7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="19" r="1.4" fill="#fff"/><circle cx="17" cy="19" r="1.4" fill="#fff"/></svg>
    </div>
    <span class="logo-text">Quick<span>Cart</span></span>
  </a>
</div>

<div class="auth-wrap">
  <!-- Left visual panel (hidden on mobile) -->
  <div class="auth-visual">
    <h2>Groceries at your door, before the kettle boils.</h2>
    <p>Log in to track live orders, save your addresses, and reorder your usuals in one tap.</p>
    <div class="visual-grid">
      <div class="visual-tile" style="background:rgba(255,255,255,.08);border-radius:22px;">🍎</div>
      <div class="visual-tile" style="background:rgba(255,255,255,.08);border-radius:22px;">🥛</div>
      <div class="visual-tile" style="background:rgba(255,255,255,.08);border-radius:22px;">🍪</div>
      <div class="visual-tile" style="background:rgba(255,255,255,.08);border-radius:22px;">🧃</div>
      <div class="visual-tile" style="background:rgba(255,255,255,.08);border-radius:22px;">🧴</div>
      <div class="visual-tile" style="background:rgba(255,255,255,.08);border-radius:22px;">🍞</div>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="auth-form-side">
    <div class="auth-card">
      <h1 id="authTitle">Welcome back</h1>
      <p class="sub" id="authSub">Log in to track orders and reorder faster.</p>

      <div class="auth-tabs">
        <button class="active" id="tabLogin">Login</button>
        <button id="tabSignup">Sign up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <div class="auth-field">
          <label>Email</label>
          <input type="email" placeholder="you@example.com" required>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <div class="auth-row">
          <label class="auth-check"><input type="checkbox"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="auth-submit">Log in</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-hidden">
        <div class="auth-field">
          <label>Full name</label>
          <input type="text" placeholder="Your name" required>
        </div>
        <div class="auth-field">
          <label>Email</label>
          <input type="email" placeholder="you@example.com" required>
        </div>
        <div class="auth-field">
          <label>Phone number</label>
          <input type="tel" placeholder="10-digit mobile number" required>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" placeholder="Create a password" required>
        </div>
        <button type="submit" class="auth-submit">Create account</button>
      </form>

      <p class="auth-switch" id="authSwitch">
        New here? <a href="#" id="switchToSignup">Create an account</a>
      </p>

      <a class="auth-guest" href="index.html">Continue browsing as guest →</a>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="login.js"></script>
</body>
</html>
